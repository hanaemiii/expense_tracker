name: expense_tracker
description: An offline-first expense tracker for iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^16.0.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  image_picker: ^1.2.0
  flutter_doc_scanner: ^0.0.16
  pdf: ^3.11.3
  share_plus: ^12.0.0
  fl_chart: ^1.1.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/empty_receipt.svg
    - lib/core/services/fonts/Roboto-Regular.ttf
    - lib/core/services/fonts/Roboto-Bold.ttf
